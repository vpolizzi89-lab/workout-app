<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Vince's Workout</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Roboto,sans-serif;background:#0f1115;color:#e8eaed;padding-bottom:170px}
header{padding:14px 16px;background:#161a22;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 6px}
.days{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}.days button{flex:0 0 auto}
button{background:#232936;color:#e8eaed;border:0;border-radius:10px;padding:12px 14px;font-size:15px;min-height:44px}
button.on,.primary{background:#ff7a1a;color:#111;font-weight:700}
.card{background:#181c25;border-radius:14px;padding:14px;margin:10px 12px}
.sub{color:#9aa3b2;font-size:13px}.sug{color:#4ade80;font-size:14px;margin:4px 0}
.set{display:grid;grid-template-columns:28px 1fr 1fr 64px;gap:8px;align-items:center;margin-top:8px}
input,textarea,select{width:100%;background:#0f1115;color:#fff;border:1px solid #333b4a;border-radius:10px;padding:12px;font-size:17px}
.set button.done{background:#16a34a;color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#161a22;padding:8px;gap:6px}nav button{flex:1;padding:10px 2px;font-size:13px}
.meal{display:flex;gap:10px;margin-top:10px;border-top:1px solid #2a3140;padding-top:10px}.meal img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:0 0 auto}.meal .r{flex:1;min-width:0}.meal input{padding:8px;font-size:15px}
.big{width:100%;font-size:18px;padding:18px}.bar{height:10px;background:#2a3140;border-radius:6px;overflow:hidden;margin-top:6px}.bar div{height:100%;background:#4ade80}
#timer{position:fixed;bottom:72px;left:12px;right:12px;background:#ff7a1a;color:#111;border-radius:14px;padding:12px 16px;display:none;justify-content:space-between;align-items:center;font-weight:700;font-size:22px;z-index:9}
#timer button{background:#111;color:#fff}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#4ade80;color:#111;padding:10px 18px;border-radius:20px;font-weight:700;display:none;z-index:20}
.mini{min-height:34px;padding:6px 12px;font-size:14px;margin-right:6px}pre{white-space:pre-wrap;font-family:inherit;background:#0f1115;padding:10px;border-radius:10px}
#syncst{position:absolute;right:14px;top:16px;font-size:12px;color:#9aa3b2;max-width:45%;text-align:right}#syncst.err{color:#f87171}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.kv div{background:#0f1115;border-radius:10px;padding:8px}.kv b{display:block;font-size:17px}.kv span{color:#9aa3b2;font-size:12px}.dl{color:#9aa3b2;font-size:12px}.up{color:#4ade80}.dn{color:#f87171}details summary{cursor:pointer;color:#9aa3b2;margin-top:8px}
canvas{width:100%;height:180px;background:#0f1115;border-radius:10px}
</style></head><body>
<header><div id="syncst" onclick="view='settings';render()"></div><h1 id="title">Workout</h1><div class="sub" id="subtitle"></div></header>
<main id="main"></main>
<div id="toast">Copied</div><div id="timer"><span id="tleft">2:00</span><span><button id="tadd">+30s</button> <button id="tskip">Skip</button></span></div>
<nav><button data-v="today" class="on">Workout</button><button data-v="history">History</button><button data-v="meals">Meals</button><button data-v="body">Body</button><button data-v="settings">More</button></nav>
<script>
const DEFAULT_PLAN={
1:{name:"Upper A",type:"lift",rest:120,ex:[["Chest press",4,6,8],["Lat pulldown",4,6,8],["Shoulder press",3,8,10],["Seated row",3,8,10],["Biceps curl machine",2,8,10],["Triceps press",2,8,10]]},
2:{name:"Lower A",type:"lift",rest:120,ex:[["Leg press",4,6,8],["Smith machine Romanian deadlift",3,8,8],["Leg curl",3,10,10],["Calf raise on leg press",3,12,15],["Abdominal crunch (Hammer Strength)",3,10,12]]},
3:{name:"Easy run with Leroy",type:"cardio",note:"Easy 20-30 min, conversational pace"},
4:{name:"Upper B",type:"lift",rest:90,ex:[["Seated row",3,10,12],["Dumbbell incline press",3,10,12],["Lat pulldown",3,10,12],["Dumbbell lateral raise",3,12,15],["Biceps curl machine",3,12,12],["Triceps press",3,12,12]]},
5:{name:"Lower B",type:"lift",rest:90,ex:[["Smith machine squat / goblet squat",3,10,12],["Leg extension",3,12,15],["Leg curl",3,12,15],["Dumbbell walking lunge (per leg)",2,10,10],["Abdominal crunch",3,15,15]]},
6:{name:"Longer run with Leroy",type:"cardio",note:"A bit longer if you both feel good"},
0:{name:"Rest / easy bike",type:"cardio",note:"Rest, or 20 min easy indoor bike"}};
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const K="vwt_v1";
let S=load();function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.plan)return d}catch(e){}return{plan:JSON.parse(JSON.stringify(DEFAULT_PLAN)),sessions:[],cardio:[],body:[],daily:[],draft:{}}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function persist(){["sessions","cardio","body","daily"].forEach(t=>(S[t]=S[t]||[]).forEach(r=>{if(!r.id)r.id=uid()}));localStorage.setItem(K,JSON.stringify(S))}
function save(){persist();schedSync()}persist();
const ld=d=>{const x=d||new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")},today=()=>ld();
let day=new Date().getDay(),view="today",$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lastFor(name){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].ex.find(x=>x.name===name&&x.sets.some(s=>s.done));if(e)return e}return null}
function suggestion(ex){const l=lastFor(ex[0]);if(!l)return null;const d=l.sets.filter(s=>s.done);if(d.length>=ex[1]&&d.every(s=>+s.reps>=ex[3])){const w=Math.max(...d.map(s=>+s.w||0));return w+5}return null}
function draftKey(){return today()+"_"+day}
function getDraft(){const k=draftKey(),p=S.plan[day];const dk=S.draft[k];if(dk&&(dk.ex.length!==p.ex.length||dk.ex.some((e,i)=>e.name!==p.ex[i][0]||e.sets.length!==p.ex[i][1]))&&!dk.ex.some(e=>e.sets.some(x=>x.done)))delete S.draft[k];if(!S.draft[k]){S.draft={};S.draft[k]={ex:p.ex.map(e=>{const l=lastFor(e[0]),sg=suggestion(e);return{name:e[0],sets:Array.from({length:e[1]},(_,i)=>({w:p.ex.find(q=>q[0]===e[0])[4]||(sg??(l&&l.sets[i]?l.sets[i].w:(l?l.sets[0].w:""))),reps:l&&l.sets[i]?l.sets[i].reps:e[2],done:false}))}})}}return S.draft[k]}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));({today:rToday,history:rHist,body:rBody,settings:rSet,meals:rMeals})[view]()}
function rToday(){const p=S.plan[day];$("#title").textContent=DN[day]+" · "+p.name;$("#subtitle").textContent=p.type==="lift"?`Rest ${p.rest}s · leave ~2 reps in reserve`:p.note||"";
let h='<div class="days">'+[1,2,3,4,5,6,0].map(d=>`<button class="${d==day?"on":""}" onclick="day=${d};render()">${DN[d]}</button>`).join("")+"</div>";
if(p.type==="lift"){const dr=getDraft();save();p.ex.forEach((e,i)=>{const sg=suggestion(e),l=lastFor(e[0]);h+=`<div class="card"><h2>${esc(e[0])}</h2><div class="sub">${e[1]} × ${e[2]}${e[3]!=e[2]?"-"+e[3]:""}${l?" · last: "+l.sets.filter(s=>s.done).map(s=>s.w+"×"+s.reps).join(", "):""}</div>${e[4]?`<div class="sug">🎯 Target: ${e[4]} lb</div>`:""}${sg&&!e[4]?`<div class="sug">▲ Hit top of range — try ${sg} lb</div>`:""}`;
dr.ex[i].sets.forEach((s,j)=>{h+=`<div class="set"><span class="sub">${j+1}</span><input inputmode="decimal" placeholder="lb" value="${esc(s.w)}" oninput="upd(${i},${j},'w',this.value)"><input inputmode="numeric" placeholder="reps" value="${esc(s.reps)}" oninput="upd(${i},${j},'reps',this.value)"><button class="${s.done?"done":""}" onclick="tog(${i},${j})">${s.done?"✓":"Done"}</button></div>`});h+="</div>"});
h+=`<div class="card"><textarea id="snotes" rows="2" placeholder="Session notes (optional)" oninput="getDraft().notes=this.value;save()">${esc(dr.notes||"")}</textarea><button class="primary" style="width:100%;margin-top:8px" onclick="finish()">Finish & save workout</button></div>`}
else{h+=`<div class="card"><h2>Log cardio</h2><select id="ck"><option>Run with Leroy</option><option>Indoor bike</option><option>Walk</option><option>Rest day</option></select><div class="row"><input id="cm" inputmode="decimal" placeholder="Minutes"><input id="cd" inputmode="decimal" placeholder="Miles"></div><textarea id="cn" rows="2" placeholder="Notes (avg HR, how Leroy did...)" style="margin-top:8px"></textarea><button class="primary" style="width:100%;margin-top:8px" onclick="logCardio()">Save</button></div>`;
h+='<div class="card"><h2>Recent cardio</h2>'+(S.cardio.map((c,i)=>[c,i]).slice(-8).reverse().map(([c,i])=>`<div style="margin:6px 0"><div class="sub">${esc(cardioText(c))}</div><button class="mini" onclick="shC(${i})">Share</button><button class="mini" onclick="cpC(${i})">Copy</button></div>`).join("")||'<div class="sub">None yet</div>')+"</div>"}
$("#main").innerHTML=h}
function upd(i,j,k,v){getDraft().ex[i].sets[j][k]=v;save()}
function tog(i,j){const s=getDraft().ex[i].sets[j];s.done=!s.done;save();if(s.done)startTimer(S.plan[day].rest);rToday()}
function finish(){const dr=getDraft();if(!dr.ex.some(e=>e.sets.some(s=>s.done))){alert("Mark at least one set done first.");return}
S.sessions.push({date:today(),day:S.plan[day].name,ex:dr.ex.map(e=>({name:e.name,sets:e.sets.map(s=>({w:+s.w||0,reps:+s.reps||0,done:s.done}))})),notes:dr.notes||""});delete S.draft[draftKey()];save();rSummary(S.sessions.length-1)}
function fmtDate(d,yr=true){const x=new Date(d+"T12:00:00");return x.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",...(yr?{year:"numeric"}:{})})}
function sessText(s){const L=["Workout log: "+fmtDate(s.date)+", "+s.day],nx=[];s.ex.forEach(e=>{const d=e.sets.filter(x=>x.done);if(!d.length){L.push(e.name+": not done");return}
const miss=e.sets.length-d.length;L.push(e.name+": "+d.map(x=>x.w+"x"+x.reps).join(", ")+(miss?` (${miss} set${miss>1?"s":""} not done)`:""));
let pe=null;Object.values(S.plan).forEach(p=>(p.ex||[]).forEach(q=>{if(q[0]===e.name&&(!pe||q[1]===e.sets.length))pe=q}));
if(pe&&d.length>=pe[1]&&d.every(x=>x.reps>=pe[3]))nx.push(e.name+" try "+(Math.max(...d.map(x=>x.w))+5)+" lb")});
if(nx.length)L.push("Next time: "+nx.join("; "));if(s.notes)L.push("Notes: "+s.notes);return L.join("\n")}
function cardioText(c){const a=[fmtDate(c.date,false),c.kind];if(c.min)a.push(c.min+" min");if(c.dist)a.push(c.dist+" mi");return "Cardio log: "+a.join(", ")+"."+(c.notes?" Notes: "+c.notes:"")}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",1800)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast("Copied")}
async function shareText(title,t){if(navigator.share){try{await navigator.share({title,text:t});return}catch(e){if(e&&e.name==="AbortError"){await copyText(t);return}}}await copyText(t)}
const shS=i=>shareText("Workout log",sessText(S.sessions[i])),cpS=i=>copyText(sessText(S.sessions[i])),shC=i=>shareText("Cardio log",cardioText(S.cardio[i])),cpC=i=>copyText(cardioText(S.cardio[i]));
function rSummary(i){$("#title").textContent="Workout saved 💪";$("#subtitle").textContent="Send it to your assistant";
$("#main").innerHTML=`<div class="card"><pre id="sumtxt">${esc(sessText(S.sessions[i]))}</pre><div class="row"><button class="primary" onclick="shS(${i})">Share</button><button onclick="cpS(${i})">Copy</button></div><div class="row"><button onclick="view='history';render()">History</button></div></div>`;scrollTo(0,0)}
function logCardio(){S.cardio.push({date:today(),kind:$("#ck").value,min:$("#cm").value,dist:$("#cd").value,notes:$("#cn").value});save();rToday()}
let tEnd=0,tInt=null;function startTimer(sec){tEnd=Date.now()+sec*1000;$("#timer").style.display="flex";clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){const r=Math.max(0,Math.ceil((tEnd-Date.now())/1000));$("#tleft").textContent=Math.floor(r/60)+":"+String(r%60).padStart(2,"0");if(r<=0){clearInterval(tInt);navigator.vibrate&&navigator.vibrate([400,200,400,200,400]);$("#tleft").textContent="Go!";setTimeout(()=>$("#timer").style.display="none",4000)}}
$("#tadd").onclick=()=>{tEnd+=30000};$("#tskip").onclick=()=>{clearInterval(tInt);$("#timer").style.display="none"};
function allExNames(){const n=new Set();Object.values(S.plan).forEach(p=>(p.ex||[]).forEach(e=>n.add(e[0])));S.sessions.forEach(s=>s.ex.forEach(e=>n.add(e.name)));return[...n]}
function rHist(){$("#title").textContent="History";$("#subtitle").textContent=S.sessions.length+" workouts · "+S.cardio.length+" cardio";
let h=`<div class="card"><h2>Exercise progress</h2><select id="hx" onchange="drawEx()">${allExNames().map(n=>`<option>${esc(n)}</option>`).join("")}</select><canvas id="cv" style="margin-top:8px"></canvas><div class="sub">Top set weight (lb) per session</div></div>`;
h+='<div class="card"><h2>Recent workouts</h2>'+(S.sessions.slice(-15).reverse().map((s,ri)=>`<div style="margin:8px 0"><b>${s.date}</b> ${esc(s.day)} <button style="min-height:32px;padding:4px 10px;float:right" onclick="delSess(${S.sessions.length-1-ri})">✕</button><div><button class="mini" onclick="shS(${S.sessions.length-1-ri})">Share</button><button class="mini" onclick="cpS(${S.sessions.length-1-ri})">Copy</button></div>${s.ex.filter(e=>e.sets.some(x=>x.done)).map(e=>`<div class="sub">${esc(e.name)}: ${e.sets.filter(x=>x.done).map(x=>x.w+"×"+x.reps).join(", ")}</div>`).join("")}</div>`).join("")||'<div class="sub">No workouts yet</div>')+"</div>";
h+='<div class="card"><h2>Cardio</h2>'+(S.cardio.map((c,i)=>[c,i]).slice(-15).reverse().map(([c,i])=>`<div style="margin:8px 0"><div class="sub">${esc(cardioText(c))}</div><button class="mini" onclick="shC(${i})">Share</button><button class="mini" onclick="cpC(${i})">Copy</button></div>`).join("")||'<div class="sub">None yet</div>')+"</div>";
$("#main").innerHTML=h;drawEx()}
function delSess(i){if(confirm("Delete this workout?")){S.sessions.splice(i,1);save();rHist()}}
function chart(cv,pts,color){const r=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*r;cv.height=H*r;const c=cv.getContext("2d");c.scale(r,r);c.fillStyle="#9aa3b2";c.font="12px sans-serif";
if(pts.length<1){c.fillText("No data yet",10,24);return}const ys=pts.map(p=>p.y),sp=(Math.max(...ys)-Math.min(...ys))||2,mn=Math.min(...ys)-sp*.1,mx=Math.max(...ys)+sp*.1,P=30;
const X=i=>P+(pts.length==1?(W-2*P)/2:i*(W-2*P)/(pts.length-1)),Y=v=>H-P+-(v-mn)/(mx-mn)*(H-2*P);
const fx=v=>mx-mn<10?v.toFixed(1):v.toFixed(0);c.fillText(fx(mx),2,P);c.fillText(fx(mn),2,H-P);c.strokeStyle=color;c.lineWidth=2.5;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.y)):c.moveTo(X(i),Y(p.y)));c.stroke();
c.fillStyle=color;pts.forEach((p,i)=>{if(pts.length<=40||i==pts.length-1){c.beginPath();c.arc(X(i),Y(p.y),pts.length>40?4:3.5,0,7);c.fill()}});c.fillStyle="#9aa3b2";c.fillText(pts[0].x,P,H-8);if(pts.length>1)c.fillText(pts[pts.length-1].x,W-P-70,H-8)}
function drawEx(){const n=$("#hx")&&$("#hx").value,pts=[];S.sessions.forEach(s=>{const e=s.ex.find(x=>x.name===n);if(e){const d=e.sets.filter(x=>x.done);if(d.length)pts.push({x:s.date,y:Math.max(...d.map(x=>x.w))})}});chart($("#cv"),pts,"#ff7a1a")}
const BF=[["w","Weight","lb",1],["bf","Body fat","%",1],["bfm","Fat mass","lb",1],["ffp","Fat-free","%",1],["ffm","Fat-free mass","lb",1],["smp","Skeletal muscle","%",1],["smm","Skeletal muscle","lb",1],["mp","Muscle","%",1],["mm","Muscle mass","lb",1],["bone","Bone mass","lb",1],["water","Body water","lb",1],["bmr","BMR","kcal",0]];
const BG={w:-1,bf:-1,bfm:-1,smm:1,smp:1,ffm:1,ffp:1,mm:1,mp:1};let bRange=90,bMet="w";
const num=v=>v===""||v==null||isNaN(+v)?null:+v;
function bSorted(){return S.body.filter(b=>num(b.w)).slice().sort((x,y)=>String(x.date).localeCompare(String(y.date)))}
function inRange(d,days){if(!days)return true;const t=new Date();t.setDate(t.getDate()-days);return d>=t.toISOString().slice(0,10)}
function rBody(){$("#title").textContent="Body";$("#subtitle").textContent="Samsung Health weigh-ins sync in automatically";
const L=bSorted(),last=L[L.length-1],dA=n=>{const t=new Date(last.date);t.setDate(t.getDate()-n);return t.toISOString().slice(0,10)},prev=last&&[...L].reverse().find(b=>b.date<=dA(21)&&b.date>=dA(60));
const cell=([k,n,u,dp])=>{const v=num(last[k]);if(!v)return"";const p=prev&&num(prev[k]);let dl="";if(p){const d=v-p,g=BG[k];dl=`<span class="dl ${g&&Math.abs(d)>=.05?(d*g>0?"up":"dn"):""}">${d>0?"+":""}${d.toFixed(dp)} / 4 wk</span>`}return`<div><span>${n}${u==="%"?" %":""}</span><b>${v.toFixed(dp)}${u==="%"?"%":u==="lb"?" lb":""}</b>${dl}</div>`};
const met=BF.filter(([k])=>L.some(b=>num(b[k])));
const D=(S.daily||[]).slice().sort((x,y)=>String(x.date).localeCompare(String(y.date))),dl7=D.slice(-7),av=k=>{const v=dl7.map(x=>num(x[k])).filter(x=>x);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const dl=D.length?`<div class="card"><h2>Daily activity</h2><div class="sub">7-day average</div><div class="kv">${[["steps","Steps",0],["sleep","Sleep h",1],["hr","Avg HR",0]].map(([k,n,dp])=>{const v=av(k);return v?`<div><span>${n}</span><b>${v.toLocaleString("en-US",{maximumFractionDigits:dp})}</b></div>`:""}).join("")}</div>
<details><summary>Last 14 days</summary>${D.slice(-14).reverse().map(x=>`<div class="sub">${x.date} · ${x.steps?(+x.steps).toLocaleString()+" steps":""}${x.sleep?" · "+x.sleep+" h sleep":""}${x.hr?" · avg HR "+x.hr:""}${x.rhr?" · low "+x.rhr:""}</div>`).join("")}</details></div>`:"";
$("#main").innerHTML=(last?`<div class="card"><h2>Latest · ${last.date}${last.t?" "+last.t:""}</h2><div class="sub">${last.src||"Manual"} · change vs ~4 weeks earlier</div><div class="kv">${BF.map(cell).join("")}</div></div>`:"")+
`<div class="card"><h2>Trends</h2><div class="row">${[["w","Weight"],["bf","Body fat %"],["smm","Muscle"]].concat(met.filter(([k])=>!["w","bf","smm"].includes(k)).length?[["more","More…"]]:[]).map(([k,n])=>`<button class="mini ${bMet===k?"on":""}" onclick="bMet='${k}';rBody()">${n}</button>`).join("")}</div>
${bMet==="more"||!["w","bf","smm"].includes(bMet)?`<select id="bms" style="margin-top:8px" onchange="bMet=this.value;rBody()">${met.map(([k,n,u])=>`<option value="${k}" ${k===bMet?"selected":""}>${n} (${u})</option>`).join("")}</select>`:""}
<div class="row">${[[30,"30d"],[90,"90d"],[365,"1y"],[0,"All"]].map(([d,n])=>`<button class="mini ${bRange===d?"on":""}" onclick="bRange=${d};rBody()">${n}</button>`).join("")}</div><canvas id="bc" style="margin-top:8px"></canvas></div>
<div class="card"><h2>Log a weigh-in</h2><div class="row"><input id="bw" inputmode="decimal" placeholder="Weight (lb) *"><input id="bf" inputmode="decimal" placeholder="Body fat %"></div>
