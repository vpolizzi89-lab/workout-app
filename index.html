<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Vince's Workout</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Roboto,sans-serif;background:#0f1115;color:#e8eaed;padding-bottom:170px}
header{padding:14px 16px;background:#161a22;position:sticky;top:0;z-index:5}h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 6px}
.days{display:flex;gap:6px;overflow-x:auto;padding:10px 12px}.days button{flex:0 0 auto}
button{background:#232936;color:#e8eaed;border:0;border-radius:10px;padding:12px 14px;font-size:15px;min-height:44px}
button.on,.primary{background:#ff7a1a;color:#111;font-weight:700}
.card{background:#181c25;border-radius:14px;padding:14px;margin:10px 12px}
.sub{color:#9aa3b2;font-size:13px}.sug{color:#4ade80;font-size:14px;margin:4px 0}
.set{display:grid;grid-template-columns:28px 1fr 1fr 64px;gap:8px;align-items:center;margin-top:8px}
input,textarea,select{width:100%;background:#0f1115;color:#fff;border:1px solid #333b4a;border-radius:10px;padding:12px;font-size:17px}
.set button.done{background:#16a34a;color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#161a22;padding:8px;gap:6px}nav button{flex:1;padding:10px 2px;font-size:13px}
.meal{display:flex;gap:10px;margin-top:10px;border-top:1px solid #2a3140;padding-top:10px}.meal img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:0 0 auto}.meal .r{flex:1;min-width:0}.meal input{padding:8px;font-size:15px}
.big{width:100%;font-size:18px;padding:18px}.bar{height:10px;background:#2a3140;border-radius:6px;overflow:hidden;margin-top:6px}.bar div{height:100%;background:#4ade80}
#timer{position:fixed;bottom:72px;left:12px;right:12px;background:#ff7a1a;color:#111;border-radius:14px;padding:12px 16px;display:none;justify-content:space-between;align-items:center;font-weight:700;font-size:22px;z-index:9}
#timer button{background:#111;color:#fff}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#4ade80;color:#111;padding:10px 18px;border-radius:20px;font-weight:700;display:none;z-index:20}
.mini{min-height:34px;padding:6px 12px;font-size:14px;margin-right:6px}pre{white-space:pre-wrap;font-family:inherit;background:#0f1115;padding:10px;border-radius:10px}
canvas{width:100%;height:180px;background:#0f1115;border-radius:10px}
</style></head><body>
<header><h1 id="title">Workout</h1><div class="sub" id="subtitle"></div></header>
<main id="main"></main>
<div id="toast">Copied</div><div id="timer"><span id="tleft">2:00</span><span><button id="tadd">+30s</button> <button id="tskip">Skip</button></span></div>
<nav><button data-v="today" class="on">Workout</button><button data-v="history">History</button><button data-v="meals">Meals</button><button data-v="body">Body</button><button data-v="settings">More</button></nav>
<script>
const DEFAULT_PLAN={
1:{name:"Upper A",type:"lift",rest:120,ex:[["Chest press",4,6,8],["Lat pulldown",4,6,8],["Shoulder press",3,8,10],["Seated row",3,8,10],["Biceps curl machine",2,8,10],["Triceps press",2,8,10]]},
2:{name:"Lower A",type:"lift",rest:120,ex:[["Leg press",4,6,8],["Smith machine Romanian deadlift",3,8,8],["Leg curl",3,10,10],["Calf raise on leg press",3,12,15],["Abdominal crunch (Hammer Strength)",3,10,12]]},
3:{name:"Easy run with Leroy",type:"cardio",note:"Easy 20-30 min, conversational pace"},
4:{name:"Upper B",type:"lift",rest:90,ex:[["Seated row",3,10,12],["Dumbbell incline press",3,10,12],["Lat pulldown",3,10,12],["Dumbbell lateral raise",3,12,15],["Biceps curl machine",3,12,12],["Triceps press",3,12,12]]},
5:{name:"Lower B",type:"lift",rest:90,ex:[["Smith machine squat / goblet squat",3,10,12],["Leg extension",3,12,15],["Leg curl",3,12,15],["Dumbbell walking lunge (per leg)",2,10,10],["Abdominal crunch",3,15,15]]},
6:{name:"Longer run with Leroy",type:"cardio",note:"A bit longer if you both feel good"},
0:{name:"Rest / easy bike",type:"cardio",note:"Rest, or 20 min easy indoor bike"}};
const DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const K="vwt_v1";
let S=load();function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.plan)return d}catch(e){}return{plan:JSON.parse(JSON.stringify(DEFAULT_PLAN)),sessions:[],cardio:[],body:[],draft:{}}}
function save(){localStorage.setItem(K,JSON.stringify(S))}
const ld=d=>{const x=d||new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")},today=()=>ld();
let day=new Date().getDay(),view="today",$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lastFor(name){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].ex.find(x=>x.name===name&&x.sets.some(s=>s.done));if(e)return e}return null}
function suggestion(ex){const l=lastFor(ex[0]);if(!l)return null;const d=l.sets.filter(s=>s.done);if(d.length>=ex[1]&&d.every(s=>+s.reps>=ex[3])){const w=Math.max(...d.map(s=>+s.w||0));return w+5}return null}
function draftKey(){return today()+"_"+day}
function getDraft(){const k=draftKey(),p=S.plan[day];if(!S.draft[k]){S.draft={};S.draft[k]={ex:p.ex.map(e=>{const l=lastFor(e[0]),sg=suggestion(e);return{name:e[0],sets:Array.from({length:e[1]},(_,i)=>({w:sg??(l&&l.sets[i]?l.sets[i].w:(l?l.sets[0].w:"")),reps:l&&l.sets[i]?l.sets[i].reps:e[2],done:false}))}})}}return S.draft[k]}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));({today:rToday,history:rHist,body:rBody,settings:rSet,meals:rMeals})[view]()}
function rToday(){const p=S.plan[day];$("#title").textContent=DN[day]+" · "+p.name;$("#subtitle").textContent=p.type==="lift"?`Rest ${p.rest}s · leave ~2 reps in reserve`:p.note||"";
let h='<div class="days">'+[1,2,3,4,5,6,0].map(d=>`<button class="${d==day?"on":""}" onclick="day=${d};render()">${DN[d]}</button>`).join("")+"</div>";
if(p.type==="lift"){const dr=getDraft();save();p.ex.forEach((e,i)=>{const sg=suggestion(e),l=lastFor(e[0]);h+=`<div class="card"><h2>${esc(e[0])}</h2><div class="sub">${e[1]} × ${e[2]}${e[3]!=e[2]?"-"+e[3]:""}${l?" · last: "+l.sets.filter(s=>s.done).map(s=>s.w+"×"+s.reps).join(", "):""}</div>${sg?`<div class="sug">▲ Hit top of range — try ${sg} lb</div>`:""}`;
dr.ex[i].sets.forEach((s,j)=>{h+=`<div class="set"><span class="sub">${j+1}</span><input inputmode="decimal" placeholder="lb" value="${esc(s.w)}" oninput="upd(${i},${j},'w',this.value)"><input inputmode="numeric" placeholder="reps" value="${esc(s.reps)}" oninput="upd(${i},${j},'reps',this.value)"><button class="${s.done?"done":""}" onclick="tog(${i},${j})">${s.done?"✓":"Done"}</button></div>`});h+="</div>"});
h+=`<div class="card"><textarea id="snotes" rows="2" placeholder="Session notes (optional)" oninput="getDraft().notes=this.value;save()">${esc(dr.notes||"")}</textarea><button class="primary" style="width:100%;margin-top:8px" onclick="finish()">Finish & save workout</button></div>`}
else{h+=`<div class="card"><h2>Log cardio</h2><select id="ck"><option>Run with Leroy</option><option>Indoor bike</option><option>Walk</option><option>Rest day</option></select><div class="row"><input id="cm" inputmode="decimal" placeholder="Minutes"><input id="cd" inputmode="decimal" placeholder="Miles"></div><textarea id="cn" rows="2" placeholder="Notes (avg HR, how Leroy did...)" style="margin-top:8px"></textarea><button class="primary" style="width:100%;margin-top:8px" onclick="logCardio()">Save</button></div>`;
h+='<div class="card"><h2>Recent cardio</h2>'+(S.cardio.map((c,i)=>[c,i]).slice(-8).reverse().map(([c,i])=>`<div style="margin:6px 0"><div class="sub">${esc(cardioText(c))}</div><button class="mini" onclick="shC(${i})">Share</button><button class="mini" onclick="cpC(${i})">Copy</button></div>`).join("")||'<div class="sub">None yet</div>')+"</div>"}
$("#main").innerHTML=h}
function upd(i,j,k,v){getDraft().ex[i].sets[j][k]=v;save()}
function tog(i,j){const s=getDraft().ex[i].sets[j];s.done=!s.done;save();if(s.done)startTimer(S.plan[day].rest);rToday()}
function finish(){const dr=getDraft();if(!dr.ex.some(e=>e.sets.some(s=>s.done))){alert("Mark at least one set done first.");return}
S.sessions.push({date:today(),day:S.plan[day].name,ex:dr.ex.map(e=>({name:e.name,sets:e.sets.map(s=>({w:+s.w||0,reps:+s.reps||0,done:s.done}))})),notes:dr.notes||""});delete S.draft[draftKey()];save();rSummary(S.sessions.length-1)}
function fmtDate(d,yr=true){const x=new Date(d+"T12:00:00");return x.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",...(yr?{year:"numeric"}:{})})}
function sessText(s){const L=["Workout log: "+fmtDate(s.date)+", "+s.day],nx=[];s.ex.forEach(e=>{const d=e.sets.filter(x=>x.done);if(!d.length){L.push(e.name+": not done");return}
const miss=e.sets.length-d.length;L.push(e.name+": "+d.map(x=>x.w+"x"+x.reps).join(", ")+(miss?` (${miss} set${miss>1?"s":""} not done)`:""));
let pe=null;Object.values(S.plan).forEach(p=>(p.ex||[]).forEach(q=>{if(q[0]===e.name&&(!pe||q[1]===e.sets.length))pe=q}));
if(pe&&d.length>=pe[1]&&d.every(x=>x.reps>=pe[3]))nx.push(e.name+" try "+(Math.max(...d.map(x=>x.w))+5)+" lb")});
if(nx.length)L.push("Next time: "+nx.join("; "));if(s.notes)L.push("Notes: "+s.notes);return L.join("\n")}
function cardioText(c){const a=[fmtDate(c.date,false),c.kind];if(c.min)a.push(c.min+" min");if(c.dist)a.push(c.dist+" mi");return "Cardio log: "+a.join(", ")+"."+(c.notes?" Notes: "+c.notes:"")}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",1800)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast("Copied")}
async function shareText(title,t){if(navigator.share){try{await navigator.share({title,text:t});return}catch(e){if(e&&e.name==="AbortError"){await copyText(t);return}}}await copyText(t)}
const shS=i=>shareText("Workout log",sessText(S.sessions[i])),cpS=i=>copyText(sessText(S.sessions[i])),shC=i=>shareText("Cardio log",cardioText(S.cardio[i])),cpC=i=>copyText(cardioText(S.cardio[i]));
function rSummary(i){$("#title").textContent="Workout saved 💪";$("#subtitle").textContent="Send it to your assistant";
$("#main").innerHTML=`<div class="card"><pre id="sumtxt">${esc(sessText(S.sessions[i]))}</pre><div class="row"><button class="primary" onclick="shS(${i})">Share</button><button onclick="cpS(${i})">Copy</button></div><div class="row"><button onclick="view='history';render()">History</button></div></div>`;scrollTo(0,0)}
function logCardio(){S.cardio.push({date:today(),kind:$("#ck").value,min:$("#cm").value,dist:$("#cd").value,notes:$("#cn").value});save();rToday()}
let tEnd=0,tInt=null;function startTimer(sec){tEnd=Date.now()+sec*1000;$("#timer").style.display="flex";clearInterval(tInt);tick();tInt=setInterval(tick,250)}
function tick(){const r=Math.max(0,Math.ceil((tEnd-Date.now())/1000));$("#tleft").textContent=Math.floor(r/60)+":"+String(r%60).padStart(2,"0");if(r<=0){clearInterval(tInt);navigator.vibrate&&navigator.vibrate([400,200,400,200,400]);$("#tleft").textContent="Go!";setTimeout(()=>$("#timer").style.display="none",4000)}}
$("#tadd").onclick=()=>{tEnd+=30000};$("#tskip").onclick=()=>{clearInterval(tInt);$("#timer").style.display="none"};
function allExNames(){const n=new Set();Object.values(S.plan).forEach(p=>(p.ex||[]).forEach(e=>n.add(e[0])));S.sessions.forEach(s=>s.ex.forEach(e=>n.add(e.name)));return[...n]}
function rHist(){$("#title").textContent="History";$("#subtitle").textContent=S.sessions.length+" workouts · "+S.cardio.length+" cardio";
let h=`<div class="card"><h2>Exercise progress</h2><select id="hx" onchange="drawEx()">${allExNames().map(n=>`<option>${esc(n)}</option>`).join("")}</select><canvas id="cv" style="margin-top:8px"></canvas><div class="sub">Top set weight (lb) per session</div></div>`;
h+='<div class="card"><h2>Recent workouts</h2>'+(S.sessions.slice(-15).reverse().map((s,ri)=>`<div style="margin:8px 0"><b>${s.date}</b> ${esc(s.day)} <button style="min-height:32px;padding:4px 10px;float:right" onclick="delSess(${S.sessions.length-1-ri})">✕</button><div><button class="mini" onclick="shS(${S.sessions.length-1-ri})">Share</button><button class="mini" onclick="cpS(${S.sessions.length-1-ri})">Copy</button></div>${s.ex.filter(e=>e.sets.some(x=>x.done)).map(e=>`<div class="sub">${esc(e.name)}: ${e.sets.filter(x=>x.done).map(x=>x.w+"×"+x.reps).join(", ")}</div>`).join("")}</div>`).join("")||'<div class="sub">No workouts yet</div>')+"</div>";
h+='<div class="card"><h2>Cardio</h2>'+(S.cardio.map((c,i)=>[c,i]).slice(-15).reverse().map(([c,i])=>`<div style="margin:8px 0"><div class="sub">${esc(cardioText(c))}</div><button class="mini" onclick="shC(${i})">Share</button><button class="mini" onclick="cpC(${i})">Copy</button></div>`).join("")||'<div class="sub">None yet</div>')+"</div>";
$("#main").innerHTML=h;drawEx()}
function delSess(i){if(confirm("Delete this workout?")){S.sessions.splice(i,1);save();rHist()}}
function chart(cv,pts,color){const r=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*r;cv.height=H*r;const c=cv.getContext("2d");c.scale(r,r);c.fillStyle="#9aa3b2";c.font="12px sans-serif";
if(pts.length<1){c.fillText("No data yet",10,24);return}const ys=pts.map(p=>p.y),mn=Math.min(...ys)-5,mx=Math.max(...ys)+5,P=30;
const X=i=>P+(pts.length==1?(W-2*P)/2:i*(W-2*P)/(pts.length-1)),Y=v=>H-P+-(v-mn)/(mx-mn)*(H-2*P);
c.fillText(mx.toFixed(0),2,P);c.fillText(mn.toFixed(0),2,H-P);c.strokeStyle=color;c.lineWidth=2.5;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p.y)):c.moveTo(X(i),Y(p.y)));c.stroke();
c.fillStyle=color;pts.forEach((p,i)=>{c.beginPath();c.arc(X(i),Y(p.y),4,0,7);c.fill()});c.fillStyle="#9aa3b2";c.fillText(pts[0].x,P,H-8);if(pts.length>1)c.fillText(pts[pts.length-1].x,W-P-70,H-8)}
function drawEx(){const n=$("#hx")&&$("#hx").value,pts=[];S.sessions.forEach(s=>{const e=s.ex.find(x=>x.name===n);if(e){const d=e.sets.filter(x=>x.done);if(d.length)pts.push({x:s.date,y:Math.max(...d.map(x=>x.w))})}});chart($("#cv"),pts,"#ff7a1a")}
function rBody(){$("#title").textContent="Body weight";$("#subtitle").textContent="Watch the weekly trend, not single readings";
$("#main").innerHTML=`<div class="card"><div class="row"><input id="bw" inputmode="decimal" placeholder="Weight (lb)"><input id="bf" inputmode="decimal" placeholder="Body fat %"></div><button class="primary" style="width:100%;margin-top:8px" onclick="logBody()">Save</button></div><div class="card"><canvas id="bc"></canvas>${S.body.slice(-10).reverse().map(b=>`<div class="sub">${b.date} · ${b.w} lb${b.bf?" · "+b.bf+"%":""}</div>`).join("")}</div>`;
chart($("#bc"),S.body.map(b=>({x:b.date,y:+b.w})),"#4ade80")}
function logBody(){const w=$("#bw").value;if(!w)return;S.body.push({date:today(),w:+w,bf:$("#bf").value});save();rBody()}
function rSet(){$("#title").textContent="More";$("#subtitle").textContent="Backup, import, edit exercises";
let h=`<div class="card"><h2>Backup</h2><div class="row"><button onclick="exp('json')">Export JSON</button><button onclick="exp('csv')">Export CSV</button></div><div class="row"><button onclick="$('#imp').click()">Import JSON</button><button onclick="share()">Share</button></div><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="imp(this)"></div>`;
h+=`<div class="card"><h2>Edit exercises</h2><select id="ed" onchange="rEd()">${[1,2,4,5].map(d=>`<option value="${d}">${DN[d]} · ${esc(S.plan[d].name)}</option>`).join("")}</select><div id="edl"></div></div><div class="card"><button onclick="if(confirm('Reset plan to default? History is kept.')){S.plan=JSON.parse(JSON.stringify(DEFAULT_PLAN));S.draft={};save();rSet()}">Reset plan to default</button></div>`;
$("#main").innerHTML=h;rEd()}
function rEd(){const d=$("#ed").value,p=S.plan[d];$("#edl").innerHTML=`<div class="row"><span class="sub">Rest (s)</span><input value="${p.rest}" inputmode="numeric" onchange="S.plan[${d}].rest=+this.value||90;save()"></div>`+p.ex.map((e,i)=>`<div style="border-top:1px solid #2a3140;margin-top:10px;padding-top:6px"><input value="${esc(e[0])}" onchange="S.plan[${d}].ex[${i}][0]=this.value;S.draft={};save()"><div class="row"><input title="sets" inputmode="numeric" value="${e[1]}" onchange="setN(${d},${i},1,this.value)"><input title="min reps" inputmode="numeric" value="${e[2]}" onchange="setN(${d},${i},2,this.value)"><input title="max reps" inputmode="numeric" value="${e[3]}" onchange="setN(${d},${i},3,this.value)"><button onclick="S.plan[${d}].ex.splice(${i},1);S.draft={};save();rEd()">✕</button></div></div>`).join("")+`<div class="sub">Fields: name · sets · min reps · max reps</div><button class="primary" style="width:100%;margin-top:8px" onclick="S.plan[${d}].ex.push(['New exercise',3,8,12]);S.draft={};save();rEd()">+ Add exercise</button>`}
function setN(d,i,k,v){S.plan[d].ex[i][k]=Math.max(1,+v||1);S.draft={};save()}
function csv(){let r=["date,workout,exercise,set,weight_lb,reps,done"];S.sessions.forEach(s=>s.ex.forEach(e=>e.sets.forEach((x,i)=>r.push([s.date,s.day,e.name,i+1,x.w,x.reps,x.done].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")))));
S.cardio.forEach(c=>r.push(['"'+c.date+'"','"cardio"','"'+c.kind+'"','""','""','""','"'+c.min+' min '+c.dist+' mi '+String(c.notes).replace(/"/g,'""')+'"'].join(",")));S.body.forEach(b=>r.push(`"${b.date}","bodyweight","",,"${b.w}","","${b.bf}"`));return r.join("\n")}
async function blob(t){const ms=await mAll();if(t==="csv")return new Blob([csv()+mealCsv(ms)],{type:"text/csv"});const out=Object.assign({},S,{meals:await Promise.all(ms.map(async m=>Object.assign({},m,{img:m.img?await b2d(m.img):null})))});return new Blob([JSON.stringify(out,null,1)],{type:"application/json"})}
function mealCsv(ms){return ms.map(m=>"\n"+[m.date,"meal",m.type,"","",m.cal??"",(m.prot!=null&&m.prot!==""?m.prot+"g protein ":"")+new Date(m.ts).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})+" "+(m.note||"")].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("")}
async function exp(t){const a=document.createElement("a");a.href=URL.createObjectURL(await blob(t));a.download="workout-log-"+today()+"."+t;a.click()}
async function share(){const f=new File([await blob("json")],"workout-log-"+today()+".json",{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Workout log"});else exp("json")}
function imp(inp){const f=inp.files[0];if(!f)return;f.text().then(async t=>{const d=JSON.parse(t);if(!d.sessions||!d.plan)throw 0;const ml=d.meals||[];delete d.meals;S=Object.assign({cardio:[],body:[],draft:{}},d);save();for(const m of ml){m.img=m.img?await (await fetch(m.img)).blob():null;await mPut(m)}alert("Imported "+S.sessions.length+" workouts");render()}).catch(()=>alert("Not a valid backup file"))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");
// ---- Meals (IndexedDB) ----
let dbp;function db(){return dbp||(dbp=new Promise((ok,no)=>{const r=indexedDB.open("vwt_meals",1);r.onupgradeneeded=()=>r.result.createObjectStore("meals",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))}
async function tx(mode,fn){const d=await db();return new Promise((ok,no)=>{const t=d.transaction("meals",mode),st=t.objectStore("meals");const r=fn(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})}
const mPut=m=>tx("readwrite",st=>st.put(m)),mDel=id=>tx("readwrite",st=>st.delete(id)),mAll=async()=>((await tx("readonly",st=>st.getAll()))||[]).sort((a,b)=>a.ts-b.ts);
const b2d=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});
async function compress(file){const bmp=await createImageBitmap(file).catch(async()=>{const i=new Image();i.src=URL.createObjectURL(file);await i.decode();return i});const k=Math.min(1,1024/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,"image/jpeg",0.75))}
function defType(){const h=new Date().getHours();return h<10.5?"Breakfast":h<15?"Lunch":h>=17&&h<21?"Dinner":"Snack"}
let mDay=null,urls=[];
const tStr=ts=>new Date(ts).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
function mealText(m){let t="Meal log: "+fmtDate(m.date)+", "+tStr(m.ts)+", "+m.type+".";if(m.note)t+=" Note: "+m.note.trim()+(/[.!?]$/.test(m.note.trim())?"":".");if(m.cal)t+=" Calories: "+m.cal+".";if(m.prot)t+=" Protein: "+m.prot+" g.";return t}
const mFile=(m,i)=>new File([m.img],`meal-${m.date}-${m.type.toLowerCase()}${i!=null?"-"+(i+1):""}.jpg`,{type:"image/jpeg"});
function dl(m){const a=document.createElement("a");a.href=URL.createObjectURL(m.img);a.download=mFile(m).name;a.click()}
async function shareMeals(ms,title,text){const files=ms.filter(m=>m.img).map((m,i)=>mFile(m,ms.length>1?i:null));
if(navigator.share&&navigator.canShare&&files.length&&navigator.canShare({files})){try{await navigator.share({files,title,text});return}catch(e){if(e.name==="AbortError")return}}
await shareText(title,text);if(files.length&&confirm(`Photo sharing isn't supported here. Download ${files.length>1?"the "+files.length+" photos":"the photo"} so you can attach ${files.length>1?"them":"it"}?`))ms.forEach(m=>m.img&&dl(m))}
async function shareMeal(id){const m=(await mAll()).find(x=>x.id===id);shareMeals([m],"Meal log",mealText(m))}
async function shareDay(){const ms=(await mAll()).filter(m=>m.date===mDay);if(!ms.length)return toast("No meals");const tot=totals(ms);
const txt=`Meals for ${fmtDate(mDay)} (${ms.length}):\n`+ms.map(m=>"- "+mealText(m).replace(/^Meal log: [^,]+, [^,]+, [^,]+, /,"")).join("\n")+(tot.c||tot.p?`\nLogged totals: ${tot.c?tot.c+" cal":""}${tot.c&&tot.p?", ":""}${tot.p?tot.p+" g protein":""}`:"");shareMeals(ms,"Today's meals",txt)}
function totals(ms){return ms.reduce((a,m)=>({c:a.c+(+m.cal||0),p:a.p+(+m.prot||0)}),{c:0,p:0})}
async function addMeal(inp){const f=inp.files[0];if(!f)return;toast("Saving...");const img=await compress(f);const now=new Date();
await mPut({id:now.getTime()+"-"+Math.random().toString(36).slice(2,6),ts:now.getTime(),date:ld(now),type:$("#mt").value,note:$("#mn").value,cal:"",prot:"",img});mDay=ld(now);inp.value="";toast("Meal saved");rMeals()}
async function updMeal(id,k,v){const m=(await mAll()).find(x=>x.id===id);m[k]=v;await mPut(m);mTotals()}
async function delMeal(id){if(confirm("Delete this meal?")){await mDel(id);rMeals()}}
async function mTotals(){const t=totals((await mAll()).filter(m=>m.date===mDay)),e=$("#mtot");if(!e)return;const pct=Math.min(100,t.p/160*100);
e.innerHTML=`<div><b>${t.p} g</b> protein <span class="sub">/ 160-180 g target</span> · <b>${t.c}</b> cal</div><div class="bar"><div style="width:${pct}%;background:${t.p>=160?"#4ade80":"#ff7a1a"}"></div></div>`}
function shiftDay(n){const d=new Date(mDay+"T12:00:00");d.setDate(d.getDate()+n);mDay=ld(d);rMeals()}
async function rMeals(){mDay=mDay||today();$("#title").textContent="Meals";$("#subtitle").textContent="Snap it, share it, track protein";urls.forEach(URL.revokeObjectURL);urls=[];
const ms=(await mAll()).filter(m=>m.date===mDay),isT=mDay===today();if(view!=="meals")return;
let h=`<div class="card"><div class="row" style="align-items:center;margin:0"><button style="flex:0 0 52px" onclick="shiftDay(-1)">‹</button><div style="text-align:center"><b>${isT?"Today":fmtDate(mDay)}</b></div><button style="flex:0 0 52px" onclick="shiftDay(1)" ${isT?"disabled":""}>›</button></div><div id="mtot" style="margin-top:10px"></div></div>`;
if(isT)h+=`<div class="card"><div class="row" style="margin-top:0"><select id="mt">${["Breakfast","Lunch","Dinner","Snack"].map(t=>`<option ${t===defType()?"selected":""}>${t}</option>`).join("")}</select></div><input id="mn" placeholder="Note: portion, sauces, drinks (optional)" style="margin-top:8px">
<button class="primary big" style="margin-top:10px" onclick="$('#mcam').click()">📷 Take meal photo</button><button style="width:100%;margin-top:8px" onclick="$('#mgal').click()">Choose from gallery</button>
<input type="file" id="mcam" accept="image/*" capture="environment" style="display:none" onchange="addMeal(this)"><input type="file" id="mgal" accept="image/*" style="display:none" onchange="addMeal(this)"></div>`;
h+=`<div class="card"><div class="row" style="margin-top:0;align-items:center"><h2 style="margin:0">${ms.length} meal${ms.length==1?"":"s"}</h2>${ms.length?`<button class="primary" onclick="shareDay()">Share ${isT?"today's":"day's"} meals</button>`:""}</div>`+
(ms.map(m=>{let u="";if(m.img){u=URL.createObjectURL(m.img);urls.push(u)}return `<div class="meal">${u?`<img src="${u}" alt="">`:""}<div class="r"><b>${esc(m.type)}</b> <span class="sub">${tStr(m.ts)}</span>${m.note?`<div class="sub">${esc(m.note)}</div>`:""}
<div class="row" style="margin-top:6px"><input inputmode="numeric" placeholder="cal" value="${esc(m.cal)}" onchange="updMeal('${m.id}','cal',this.value)"><input inputmode="numeric" placeholder="protein g" value="${esc(m.prot)}" onchange="updMeal('${m.id}','prot',this.value)"></div>
<div style="margin-top:6px"><button class="mini primary" onclick="shareMeal('${m.id}')">Share</button><button class="mini" onclick="delMeal('${m.id}')">Delete</button></div></div></div>`}).join("")||'<div class="sub" style="margin-top:8px">No meals logged</div>')+"</div>";
$("#main").innerHTML=h;mTotals()}
render();
</script></body></html>
